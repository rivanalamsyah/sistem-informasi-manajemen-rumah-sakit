##############################################################################
#  Nginx Virtual Host — SIMRS Production
#  File: /etc/nginx/sites-available/simrs
#  Enable: sudo ln -s /etc/nginx/sites-available/simrs /etc/nginx/sites-enabled/
#  Test: sudo nginx -t
#  Reload: sudo systemctl reload nginx
##############################################################################

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/m;

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name simrs.rumahsakit.co.id www.simrs.rumahsakit.co.id;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name simrs.rumahsakit.co.id www.simrs.rumahsakit.co.id;

    root /var/www/simrs/current/public;
    index index.php;

    # ── SSL Certificates (Let's Encrypt / Certbot) ────────────────────────
    ssl_certificate     /etc/letsencrypt/live/simrs.rumahsakit.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simrs.rumahsakit.co.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── SSL Hardening ─────────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.bunny.net; font-src 'self' fonts.bunny.net; img-src 'self' data:; connect-src 'self'" always;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/simrs_access.log combined buffer=512k flush=1m;
    error_log  /var/log/nginx/simrs_error.log  warn;

    # ── Gzip Compression ─────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Upload Limits ─────────────────────────────────────────────────────
    client_max_body_size 20M;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # ── Static Asset Caching ──────────────────────────────────────────────
    location ~* \.(css|js|gif|jpg|jpeg|png|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        try_files $uri =404;
    }

    # ── Block Sensitive Files ─────────────────────────────────────────────
    location ~ /\.(env|git|htaccess|DS_Store)$ {
        deny all;
        return 404;
    }

    location ~ ^/(storage|bootstrap/cache|vendor) {
        deny all;
        return 404;
    }

    # ── Rate Limiting: Login Endpoint ─────────────────────────────────────
    location = /login {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Rate Limiting: API / AJAX Endpoints ───────────────────────────────
    location ^~ /api/ {
        limit_req zone=api burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Main Laravel Handler ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.5-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_connect_timeout  60s;
        fastcgi_send_timeout     120s;
        fastcgi_read_timeout     120s;
        fastcgi_buffer_size      16k;
        fastcgi_buffers          4 16k;

        # Hide PHP version
        fastcgi_hide_header X-Powered-By;
    }

    # ── Block PHP execution in uploads directory ───────────────────────────
    location ~* /storage/.*\.php$ {
        deny all;
        return 403;
    }

    # ── Health Check Endpoint ─────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}

[program:simrs-worker]
; ── Laravel Queue Worker via Supervisor ────────────────────────────────────
; File: /etc/supervisor/conf.d/simrs-worker.conf
; Apply: sudo supervisorctl reread && sudo supervisorctl update

command=/usr/bin/php /var/www/simrs/current/artisan queue:work database \
    --sleep=3 \
    --tries=3 \
    --max-time=3600 \
    --memory=256

process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=1
startretries=3

redirect_stderr=true
stdout_logfile=/var/log/supervisor/simrs-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/simrs-worker-error.log

user=www-data
stopwaitsecs=3600           ; Tunggu job aktif selesai sebelum stop (max 1 jam)
killasgroup=true
stopasgroup=true

environment=LARAVEL_SAIL=""

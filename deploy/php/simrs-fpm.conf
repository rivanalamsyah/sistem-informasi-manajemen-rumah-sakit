; PHP-FPM Pool Configuration for SIMRS Production
; File: /etc/php/8.5/fpm/pool.d/simrs.conf

[simrs]
; ── Process Management ─────────────────────────────────────────────────────
user  = www-data
group = www-data

listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500          ; Restart worker setelah 500 request (cegah memory leak)

; ── Timeouts ──────────────────────────────────────────────────────────────
request_terminate_timeout = 120s
request_slowlog_timeout   = 10s
slowlog                   = /var/log/php/simrs_slow.log

; ── Environment ───────────────────────────────────────────────────────────
env[HOSTNAME] = $HOSTNAME
env[PATH]     = /usr/local/bin:/usr/bin:/bin
env[TMP]      = /tmp
env[TMPDIR]   = /tmp
env[TEMP]     = /tmp

; ── PHP ini overrides ─────────────────────────────────────────────────────
php_admin_value[error_log]           = /var/log/php/simrs_fpm_error.log
php_admin_flag[log_errors]           = on
php_admin_value[memory_limit]        = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size]       = 22M
php_admin_value[max_execution_time]  = 120
php_admin_value[max_input_time]      = 60
php_admin_flag[display_errors]       = off
php_admin_flag[display_startup_errors] = off
php_admin_value[expose_php]          = off

; ── OPcache (di php.ini atau melalui ini_set) ─────────────────────────────
; Pastikan /etc/php/8.5/mods-available/opcache.ini berisi:
; opcache.enable=1
; opcache.memory_consumption=128
; opcache.interned_strings_buffer=8
; opcache.max_accelerated_files=10000
; opcache.revalidate_freq=2
; opcache.validate_timestamps=0      ; 0 untuk production (cache permanen)
